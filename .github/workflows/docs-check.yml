name: Docs check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check links, anchors and privacy date
        run: python3 .github/scripts/check_docs.py "${{ github.event.pull_request.base.sha || github.event.before }}"
